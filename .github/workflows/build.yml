name: Build and Release APK

on:
  push:
    branches:
      - main
      - master

# Ye 2 line nayi add ki hain (Bot ko upload karne ki permission dene ke liye)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🛠️ Build Universal APK
        run: flutter build apk --release

      - name: 🚀 Upload APK to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "Auto-Build"
          name: "Latest Secret Vault Update"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
```eof

Isko VS Code me paste karke save karo aur GitHub par Push (Commit/Sync changes) kar do. Fir spinner dekho, is baar pakka green tick ✅ aayega aur Releases tab me tumhari nayi APK dikhegi! Fatafat check karke batao.